[pytest]
testpaths = tests
asyncio_mode = strict
# Pin the async-fixture loop scope (pytest-asyncio 1.4 defaults to "fixture";
# will switch to "function" in a future release) to avoid a silent behavior change.
asyncio_default_fixture_loop_scope = function
# Third-party deprecation noise, scoped so genuine src/tests deprecations still surface:
# rich-click 1.9.8 imports deprecated click.utils helpers (Click 9.0 removal);
# google-genai 2.22 uses typing._UnionGenericAlias (Python 3.17 removal, visible on 3.14+).
filterwarnings =
    ignore::DeprecationWarning:rich_click
    ignore::DeprecationWarning:google\.genai
markers =
    no_auto_mock_llm: Run test without automatic LLM deterministic mock
